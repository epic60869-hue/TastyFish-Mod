name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.2)"
        required: true
        default: "1.0.2"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: tastyfish-mod
          path: build/libs/*.jar

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No mod JAR was found in build/libs"
            exit 1
          fi

          gh release create "v${VERSION}" "$JAR" \
            --title "TastyFish Mod v${VERSION}" \
            --generate-notes
